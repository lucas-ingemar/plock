version: "2"
sql:
  - engine: "sqlite"
    schema: "db/schema.sql"
    queries: "db/queries"
    gen:
      go:
        package: "database"
        out: "pkg/database"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        output_db_file_name: "queries.go"
        overrides:
          - column: hauls.id
            go_type:
              import: github.com/gofrs/uuid/v5
              package: uuid
              type: UUID
          - column: haul_proteins.haul_id
            go_type:
              import: github.com/gofrs/uuid/v5
              package: uuid
              type: UUID
          - column: haul_cuisines.haul_id
            go_type:
              import: github.com/gofrs/uuid/v5
              package: uuid
              type: UUID

          - column: hauls.status
            go_type:
              import: github.com/lucas-ingemar/plock/pkg/types
              type: Status
          - column: hauls.max_cooking_minutes
            go_type:
              import: github.com/lucas-ingemar/plock/pkg/types
              type: CookingMinutes
          - column: haul_proteins.protein
            go_type:
              import: github.com/lucas-ingemar/plock/pkg/types
              type: Protein
          - column: haul_cuisines.cuisine
            go_type:
              import: github.com/lucas-ingemar/plock/pkg/types
              type: Cuisine

          - column: "receipts.id"
            go_type:
              import: github.com/gofrs/uuid/v5
              package: uuid
              type: UUID
          - column: "receipts.haul_id"
            go_type:
              import: github.com/gofrs/uuid/v5
              package: uuid
              type: UUID
          - column: "receipt_items.id"
            go_type:
              import: github.com/gofrs/uuid/v5
              package: uuid
              type: UUID
          - column: "receipt_items.receipt_id"
            go_type:
              import: github.com/gofrs/uuid/v5
              package: uuid
              type: UUID
          - column: "receipt_items.is_food"
            go_type: "bool"

          # recipes
          - column: "recipes.id"
            go_type:
              import: github.com/gofrs/uuid/v5
              package: uuid
              type: UUID
          - column: "recipes.haul_id"
            go_type:
              import: github.com/gofrs/uuid/v5
              package: uuid
              type: UUID
          - column: "recipe_ingredients.id"
            go_type:
              import: github.com/gofrs/uuid/v5
              package: uuid
              type: UUID
          - column: "recipe_ingredients.recipe_id"
            go_type:
              import: github.com/gofrs/uuid/v5
              package: uuid
              type: UUID
          - column: "recipe_steps.id"
            go_type:
              import: github.com/gofrs/uuid/v5
              package: uuid
              type: UUID
          - column: "recipe_steps.recipe_id"
            go_type:
              import: github.com/gofrs/uuid/v5
              package: uuid
              type: UUID
