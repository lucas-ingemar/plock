version: "2"
sql:
  - engine: "sqlite"
    schema: "db/schema.sql"
    queries: "db/queries"
    gen:
      go:
        package: "database"
        out: "pkg/database"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        output_db_file_name: "queries.go"
